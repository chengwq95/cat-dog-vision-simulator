<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>猫狗视觉模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<style>
/* 布局：全屏 3D 画面，四周浮动的深色玻璃 HUD；整体只有一种（夜间客厅）外观 */
:root{
  color-scheme: dark;
  --bg:#0b1016; --panel:rgba(14,20,28,.78); --line:rgba(255,255,255,.14);
  --fg:#eef2f5; --dim:#a9b4bf; --amber:#f5a524; --amber-ink:#1a1204;
  --teal:#3fc6b5; --cctv:#58e08a; --danger:#ef4444;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gl: max(12px, env(safe-area-inset-left, 0px)); --gr: max(12px, env(safe-area-inset-right, 0px));
  --gt: calc(10px + env(safe-area-inset-top, 0px)); --gb: calc(12px + env(safe-area-inset-bottom, 0px));
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%; margin:0; overflow:hidden}
body{background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px}
#stage{position:fixed; inset:0; overflow:hidden; background:var(--bg)}
#stage canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0}
button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
#topbar{position:fixed; top:var(--gt); left:var(--gl); right:var(--gr); z-index:20; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; justify-content:space-between; pointer-events:none}
#topbar > *{pointer-events:auto}
#brand{display:flex; align-items:center; gap:8px; padding:7px 12px}
#brand b{font-size:13px; letter-spacing:.02em} #brand small{display:block; color:var(--dim); font-size:11px}
#controls{display:flex; flex-wrap:wrap; gap:6px; padding:5px; align-items:center}
.seg{display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:10px; padding:2px}
.btn{display:flex; align-items:center; gap:5px; height:32px; padding:0 10px; border-radius:8px; font-size:12px; font-weight:600; color:var(--dim); white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.08); color:var(--fg)}
.btn.on{background:var(--amber); color:var(--amber-ink)}
.btn.tog.on{background:var(--teal); color:#04201c}
#right{display:flex; gap:6px}
#right .btn{background:var(--panel); border:1px solid var(--line); border-radius:12px; height:36px}
@media (max-width:1400px){ html[lang="en"] #brand b{display:none} }
@media (max-width:1080px){ html[lang="en"] .btn .t{display:none} html[lang="en"] .btn{padding:0 9px; font-size:15px} }
@media (max-width:760px){ #brand small, .btn .t{display:none} .btn{padding:0 9px; font-size:15px} #brand{padding:7px 10px} }

#todo{position:fixed; z-index:19; right:var(--gr); top:calc(var(--gt) + 52px); width:236px; padding:10px 12px; max-height:60%; overflow:auto}
#todo h2{margin:0 0 6px; font-size:12px; color:var(--amber); display:flex; justify-content:space-between}
#todo ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
#todo li{font-size:12px; color:var(--fg); display:flex; gap:7px; align-items:baseline; line-height:1.35}
#todo li::before{content:"○"; color:var(--dim); flex:none}
#todo li.done{color:var(--dim); text-decoration:line-through}
#todo li.done::before{content:"●"; color:var(--teal)}
@media (max-width:760px){ #todo{top:calc(var(--gt) + 140px); width:200px} }

#toast{position:fixed; z-index:22; left:50%; top:calc(var(--gt) + 96px); transform:translateX(-50%); max-width:min(520px, calc(100% - 32px)); padding:9px 14px; font-size:12.5px; line-height:1.5; text-align:center; opacity:0; transition:opacity .3s; pointer-events:none}
#toast.show{opacity:1} #toast b{color:var(--amber)}
@media (max-width:760px){ #toast{top:calc(var(--gt) + 214px)} }

#prompt{position:fixed; z-index:21; left:50%; bottom:calc(var(--gb) + 86px); transform:translateX(-50%); background:var(--amber); color:var(--amber-ink); font-weight:700; font-size:13px; padding:9px 16px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.4); white-space:nowrap}
#prompt kbd{font-family:var(--mono); background:rgba(0,0,0,.18); border-radius:5px; padding:1px 6px; margin-right:6px}

#split{position:fixed; z-index:18; top:0; bottom:0; width:44px; margin-left:-22px; cursor:ew-resize; touch-action:none; display:flex; justify-content:center}
#split::before{content:""; width:2px; background:#fff; box-shadow:0 0 8px rgba(0,0,0,.6)}
#split .knob{position:absolute; top:50%; width:38px; height:38px; margin-top:-19px; border-radius:50%; background:#fff; color:#111; display:grid; place-items:center; font-size:15px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.45)}
#split .lab{position:absolute; bottom:calc(var(--gb) + 150px); font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; white-space:nowrap}
#split .lab.l{right:30px} #split .lab.r{left:30px}

#cctv{position:fixed; inset:0; z-index:17; pointer-events:none; font-family:var(--mono); color:var(--cctv); text-shadow:0 1px 2px #000}
#cctv .tl{position:absolute; left:var(--gl); bottom:calc(var(--gb) + 6px); font-size:12px; line-height:1.6}
#cctv .rec{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--danger); margin-right:6px; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.15}}
@media (pointer:coarse){ #cctv .tl{bottom:calc(var(--gb) + 150px)} }
#cams{position:fixed; z-index:20; left:50%; transform:translateX(-50%); top:calc(var(--gt) + 52px); display:flex; gap:4px; padding:4px; max-width:calc(100% - 24px); flex-wrap:wrap; justify-content:center}
#cams .btn{font-family:var(--mono); font-size:11px; height:28px; color:var(--cctv)}
#cams .btn.on{background:var(--cctv); color:#03170a}
@media (max-width:760px){ #cams{top:calc(var(--gt) + 140px); width:calc(100% - 24px)} }

#touch{position:fixed; inset:0; z-index:16; pointer-events:none}
#joy{position:absolute; left:calc(var(--gl) + 8px); bottom:calc(var(--gb) + 8px); width:124px; height:124px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid var(--line); pointer-events:auto; touch-action:none}
#joy i{position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px; border-radius:50%; background:rgba(255,255,255,.35)}
#acts{position:absolute; right:calc(var(--gr) + 6px); bottom:calc(var(--gb) + 10px); display:flex; gap:12px; align-items:flex-end; pointer-events:auto}
#acts button{width:66px; height:66px; border-radius:50%; font-size:22px; background:rgba(255,255,255,.14); border:1px solid var(--line); touch-action:none}
#acts button:active{background:var(--amber)}
#acts #b-jump{width:78px; height:78px; margin-bottom:26px}

#nap{position:fixed; inset:0; z-index:25; background:#05070c; display:grid; place-items:center; font-size:44px; opacity:0; pointer-events:none; transition:opacity .7s}
#nap.show{opacity:1}

#modal{position:fixed; inset:0; z-index:30; background:rgba(4,7,11,.72); display:grid; place-items:center; padding:16px; overflow:auto}
#modal .card{width:min(560px,100%); padding:22px; border-radius:20px; background:#111922; border:1px solid var(--line)}
#modal h1{margin:0 0 4px; font-size:21px; text-wrap:balance} #modal p.sub{margin:0 0 14px; color:var(--dim); font-size:13px}
#modal h3{margin:14px 0 6px; font-size:12px; color:var(--amber); letter-spacing:.06em}
#modal ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px; font-size:13px; line-height:1.55; color:#d5dde4}
#modal .keys{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13px; color:#d5dde4}
#modal .keys span:nth-child(odd){font-family:var(--mono); color:var(--amber); white-space:nowrap}
#modal .pick{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 14px}
#modal .pick button{height:44px; border-radius:12px; border:1px solid var(--line); background:#1a2530; color:var(--fg); font-weight:700; font-size:14px}
#modal .pick button.on{background:var(--amber); color:var(--amber-ink); border-color:transparent}
#modal .go{margin-top:18px; width:100%; height:44px; border-radius:12px; background:var(--amber); color:var(--amber-ink); font-weight:800; font-size:15px}
#err{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; text-align:center; background:var(--bg); color:var(--fg)}
@media (prefers-reduced-motion: reduce){ #cctv .rec{animation:none} #toast,#nap{transition:none} }
</style>

<div id="stage"></div>

<div id="topbar">
  <div id="brand" class="panel"><span style="font-size:18px">🐈</span><div><b>猫狗视觉模拟器</b></div></div>
  <div id="controls" class="panel">
    <button class="btn tog" id="t-animal" title="切换猫 / 狗（Q）">🐶<span class="t">换成狗</span></button>
    <div class="seg" role="group" aria-label="视角">
      <button class="btn on" id="v-1st" title="第一人称">👁️<span class="t">第一人称</span></button>
      <button class="btn" id="v-3rd" title="第三人称">🎥<span class="t">第三人称</span></button>
      <button class="btn" id="v-cctv" title="CCTV 监控">📹<span class="t">CCTV</span></button>
    </div>
    <div class="seg" role="group" aria-label="视觉">
      <button class="btn on" id="e-cat" title="猫咪视觉">🐱<span class="t">猫咪视觉</span></button>
      <button class="btn" id="e-human" title="人类视觉">🧑<span class="t">人类视觉</span></button>
      <button class="btn" id="e-split" title="左右对比">◐<span class="t">对比</span></button>
    </div>
    <button class="btn tog" id="t-night" title="白天 / 关灯夜晚">☀️<span class="t">白天</span></button>
    <button class="btn tog" id="t-rain" title="下雨">🌧️<span class="t">下雨</span></button>
    <button class="btn tog" id="t-q" title="画质">✨<span class="t">高画质</span></button>
  </div>
  <div id="right">
    <button class="btn" id="t-todo" title="今日待办">📋 <span id="todo-count">0/10</span></button>
    <button class="btn" id="t-lang" title="语言 / Language">EN</button>
    <button class="btn" id="t-info" title="说明">❔</button>
  </div>
</div>

<div id="todo" class="panel"><h2><span>今日待办</span><span id="todo-count2">0/10</span></h2><ul id="todo-list"></ul></div>
<div id="cams" class="panel" hidden></div>
<div id="toast" class="panel"></div>
<button id="prompt" hidden></button>
<div id="split" hidden><span class="lab l">🧑 人类视觉</span><span class="knob">⇔</span><span class="lab r">🐱 猫咪视觉</span></div>
<div id="cctv" hidden><div class="tl"><div><span class="rec"></span>REC · <span id="cam-name"></span></div><div id="cam-time"></div></div></div>
<div id="touch" hidden>
  <div id="joy"><i></i></div>
  <div id="acts"><button id="b-paw" aria-label="互动">🐾</button><button id="b-jump" aria-label="跳跃">⤴</button></div>
</div>
<div id="nap">💤</div>

<div id="modal">
  <div class="card">
    <div class="pick" role="group" aria-label="选择动物"><button id="pick-cat" class="on">🐈 当猫</button><button id="pick-dog">🐕 当狗</button></div>
    <h1 id="m-title"></h1>
    <p class="sub" id="m-sub"></p>
    <h3 id="m-h3"></h3>
    <ul id="m-list"></ul>
    <h3>怎么玩</h3>
    <div class="keys" id="keys-desktop">
      <span>W A S D</span><span>走动（按住 Shift 奔跑）</span>
      <span>鼠标</span><span>点击画面后移动鼠标环顾，Esc 释放</span>
      <span>空格</span><span>跳上沙发、餐桌、床、车顶</span>
      <span>E</span><span id="m-e">挥爪互动，没东西可玩时喵一声</span>
      <span>Q</span><span>在猫和狗之间切换</span>
    </div>
    <div class="keys" id="keys-touch" hidden>
      <span>左下摇杆</span><span>走动，推到底奔跑</span>
      <span>滑动画面</span><span>环顾四周</span>
      <span>⤴ / 🐾</span><span>跳跃 / 挥爪互动</span>
    </div>
    <button class="go" id="go">开始巡视</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ 中英文切换：界面文字在显示时翻译，切换后立刻生效 ============ */
const I18N_EN = {"3D 引擎加载失败，请检查网络后刷新页面。": "The 3D engine failed to load. Check your connection and refresh the page.", "这台设备的浏览器不支持 WebGL，无法显示 3D 画面。": "This browser does not support WebGL, so the 3D scene cannot be shown.", "<b>CCTV</b>：主人正在手机上看监控。移动方向以监控画面为准。": "<b>CCTV</b>: your owner is watching the camera feed. Movement follows the camera view.", "<b>人类眼中的夜晚</b>：关灯后只剩神台红灯和窗外路灯。": "<b>Night for humans</b>: with the lights off, only the red altar lamp and the street light remain.", "<b>人类视觉</b>：全彩、清晰，但视野窄，夜里几乎看不见。": "<b>Human vision</b>: full colour and sharp, but a narrow field of view and almost blind at night.", "<b>全部完成！</b>今天也是称职的一天，主人回家会很“惊喜”。": "<b>All done!</b> Another productive day. Your owner is in for a “surprise”.", "<b>左右对比</b>：拖动中间的圆钮，左边是人类视觉，右边是狗狗视觉。": "<b>Side by side</b>: drag the round handle. Human vision on the left, dog vision on the right.", "<b>左右对比</b>：拖动中间的圆钮，左边是人类视觉，右边是猫咪视觉。": "<b>Side by side</b>: drag the round handle. Human vision on the left, cat vision on the right.", "<b>狗狗的夜视</b>：狗也有照膜，比人亮得多，但不如猫。": "<b>Dog night vision</b>: dogs have a tapetum too. Much brighter than a human sees, but not as bright as a cat.", "<b>狗狗视觉</b>：同样分不清红绿，但比猫看得清楚一些，视野更宽；半米以内对不上焦。": "<b>Dog vision</b>: red and green also merge, but it is a little sharper than a cat and wider; nothing closer than half a metre is in focus.", "<b>猫咪的夜视</b>：照膜把路灯和神台的微光放大，屋里轮廓清晰可见。": "<b>Cat night vision</b>: the tapetum amplifies the faint street light and altar lamp, so the room is clearly visible.", "<b>猫咪视觉</b>：红绿坍缩成黄褐色，远处发糊，视野更宽。看看沙发上的四个抱枕。": "<b>Cat vision</b>: red and green collapse into yellow-brown, distance is blurry, the view is wider. Look at the four cushions on the sofa.", "壁虎断尾逃上了天花板！断掉的尾巴还在地上扭。过一会儿它会回来。": "The gecko dropped its tail and fled to the ceiling! The tail is still wriggling on the floor. It will be back in a while.", "切到「关灯夜晚」，人类视觉几乎全黑，猫咪视觉靠照膜把微光放大。": "Switch to “Lights off”: human vision is almost black, while cat vision amplifies faint light with og", "完成：<b>": "Done: <b>", "对比": "Compare", "下雨": "Rain", "白天": "Day", "画质": "Quality", "说明": "Help", "视角": "View", "视觉": "Vision", "鼠标": "Mouse", "空格": "Space", "流畅": "Smooth", "互动": "Paw", "跳跃": "Jump", "在家里走走看看，随时切换猫咪视觉和人类视觉，看同一个家有什么不同。玩的时候按 Q 可以换成狗。": "Wander around the house and switch between cat vision and human vision to see how different the same home looks. Press Q while playing to become the dog.", "在家里走走看看，随时切换狗狗视觉和人类视觉，看同一个家有什么不同。玩的时候按 Q 可以换成猫。": "Wander around the house and switch between dog vision and human vision to see how different the same home looks. Press Q while playing to become the cat.", "语言": "Language"};

function tr(v){ if(LANG!=='en'||typeof v!=='string'||!I18N_CJK.test(v)) return v; for(const k of I18N_KEYS) if(v.indexOf(k)>=0) v=v.split(k).join(I18N_EN[k]); return v.replace(/（/g,' (').replace(/）/g,')').replace(/：/g,': '); }
(function(){ const tc=Object.getOwnPropertyDescriptor(Node.prototype,'textContent'), ih=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML'), ctn=Document.prototype.createTextNode;
  Object.defineProperty(Node.prototype,'textContent',{configurable:true,enumerable:tc.enumerable,get:tc.get,set(v){ tc.set.call(this,tr(v)); }});
  Object.defineProperty(Element.prototype,'innerHTML',{configurable:true,enumerable:ih.enumerable,get:ih.get,set(v){ ih.set.call(this,tr(v)); }});
  Document.prototype.createTextNode=function(v){ return ctn.call(this,tr(v)); }; })();
const I18N_STATIC=[]; (function walk(n){ if(n.nodeType===3){ if(I18N_CJK.test(n.nodeValue)) I18N_STATIC.push({n,zh:n.nodeValue}); return; } if(n.nodeType!==1||/^(SCRIPT|STYLE|CANVAS)$/.test(n.tagName)) return;
  ['title','aria-label'].forEach(a=>{ const v=n.getAttribute(a); if(v&&I18N_CJK.test(v)) I18N_STATIC.push({el:n,a,zh:v}); }); n.childNodes.forEach(walk); })(document.body);

  I18N_STATIC.forEach(s=>{ if(s.a) s.el.setAttribute(s.a,tr(s.zh)); else s.n.nodeValue=tr(s.zh); }); const b=document.getElementById('t-lang'); if(b) b.textContent=LANG==='en'?'中文':'EN'; }

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { const d=document.createElement('div'); d.id='err'; d.textContent='3D 引擎加载失败，请检查网络后刷新页面。'; document.body.appendChild(d); return; }

/* ============ 1. 状态 ============ */
const isTouch = matchMedia('(pointer: coarse)').matches;
const S = { view:'1st', vision:'cat', night:false, rain:false, hq:!isTouch, split:0.5, cam:0,
            yaw:Math.PI, pitch:-0.05, keys:{}, joy:{x:0,y:0}, lock:0, started:false };

/* ============ 2. 音效 (WebAudio) ============ */
let AC=null, master=null, rainNode=null;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination);}catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function env(g,t,a,d,v){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function tone(f0,f1,dur,type,vol,delay,lp){
  if(!audio()) return; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  env(g,t,0.01,dur,vol||.2); let n=o;
  if(lp){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); n=f; }
  n.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
let noiseBuf=null;
function noise(dur,freq,q,vol,delay,type){
  if(!audio()) return; const t=AC.currentTime+(delay||0);
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  const g=AC.createGain(); env(g,t,0.005,dur,vol||.2); s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t+dur+.05);
}
const sfx = {
  meow(){ if(!audio()) return; const t=AC.currentTime, o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
    o.type='sawtooth'; const p=0.9+Math.random()*.25;
    o.frequency.setValueAtTime(430*p,t); o.frequency.linearRampToValueAtTime(760*p,t+.14); o.frequency.linearRampToValueAtTime(690*p,t+.3); o.frequency.exponentialRampToValueAtTime(360*p,t+.62);
    f.type='bandpass'; f.Q.value=2.2; f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(2100,t+.18); f.frequency.linearRampToValueAtTime(1000,t+.6);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.5,t+.07); g.gain.setValueAtTime(.5,t+.3); g.gain.exponentialRampToValueAtTime(.0001,t+.65);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+.7); },
  jump(){ noise(.12,500,1,.12); },
  land(){ tone(110,60,.09,'sine',.25); },
  swipe(){ noise(.1,1800,1.2,.1); },
  clink(){ tone(2100,1900,.25,'sine',.18); tone(3150,2900,.18,'sine',.1,.02); noise(.06,3000,1,.2); },
  thud(){ tone(140,50,.16,'sine',.4); noise(.08,400,1,.25); },
  scratch(){ for(let i=0;i<4;i++) noise(.09,2600+Math.random()*800,3,.16,i*.11); },
  crunch(){ for(let i=0;i<5;i++) noise(.04,1500+Math.random()*1500,2,.18,i*.13+Math.random()*.03); },
  purr(){ for(let i=0;i<5;i++){ tone(27,24,.42,'sawtooth',.5,i*.5,170); } },
  chirp(){ for(let i=0;i<3;i++) tone(3200+Math.random()*600,4300,.07,'sine',.07,i*.12); },
  ui(){ tone(880,1100,.05,'triangle',.08); },
  done(){ [660,880,1320].forEach((f,i)=>tone(f,f,.16,'triangle',.16,i*.09)); },
  squeak(){ tone(1500,2400,.08,'square',.05); },
  bark(){ [0,.24].forEach(d=>{ tone(430,170,.13,'sawtooth',.42,d,1500); noise(.08,900,1,.22,d); }); },
  step(wood,run){ noise(.035,wood?520:260,.8,(wood?.06:.03)*(run?1.6:1)); if(wood) tone(150,90,.05,'sine',.045); },
  cicak(){ for(let i=0;i<6;i++) tone(1900-i*90,1500-i*80,.035,'square',.03,i*.17); },
  rain(on){ if(!audio()) return;
    if(on && !rainNode){ noise(0,0,0,0); const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500; const g=AC.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.16,AC.currentTime+1.2); s.connect(f); f.connect(g); g.connect(master); s.start(); rainNode={s,g}; }
    else if(!on && rainNode){ const r=rainNode; rainNode=null; r.g.gain.linearRampToValueAtTime(0,AC.currentTime+.8); setTimeout(()=>{ try{r.s.stop();}catch(e){} },900); } }
};

/* ============ 3. 渲染器与后期管线 ============ */
const stage = $('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' }); }
catch(e){ const d=document.createElement('div'); d.id='err'; d.textContent='这台设备的浏览器不支持 WebGL，无法显示 3D 画面。'; document.body.appendChild(d); return; }
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const C = h => new THREE.Color(h).convertSRGBToLinear();
scene.background = C(0x8ec9f0);
scene.fog = new THREE.Fog(scene.background.clone(), 28, 90);
const allMats = [];
// 环境反射：用一个渐变球生成 PMREM，让瓷砖、金属、车漆有柔和的反光
try{ (function(){ const es=new THREE.Scene(), g=new THREE.SphereGeometry(10,24,16), p=g.attributes.position, col=[], top=C(0xbcd6f0), hor=C(0xfff4e2), bot=C(0xa59884);
  for(let i=0;i<p.count;i++){ const y=p.getY(i)/10, c=y>0?hor.clone().lerp(top,Math.min(1,y*1.6)):hor.clone().lerp(bot,Math.min(1,-y*2.5)); col.push(c.r,c.g,c.b); }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  // Broad window reflections give curved glass and coated metal a readable highlight.
  for(const [x,y,z,w,h] of [[6,3,2,4,2.5],[-5,4,-3,5,1.4]]){
    const pane=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(2.1,2.05,1.95)}));
    pane.position.set(x,y,z);pane.lookAt(0,0,0);es.add(pane);
  }
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(es,.02).texture; pm.dispose(); })(); }catch(e){}
// 天空穹顶（渐变）、云、星星
const skyMat = new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false, uniforms:{ top:{value:C(0x3f8fdc)}, hor:{value:C(0xcfe6f5)} },
  vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:'varying vec3 vP; uniform vec3 top,hor; void main(){ float h=clamp(normalize(vP).y,0.,1.); gl_FragColor=vec4(mix(hor,top,pow(h,.55)),1.); }' });
const sky = new THREE.Mesh(new THREE.SphereGeometry(84,24,12),skyMat); sky.frustumCulled=false; scene.add(sky);
const clouds = new THREE.Group(); scene.add(clouds);
(function(){ const cm=new THREE.MeshBasicMaterial({color:C(0xffffff),fog:false,transparent:true,opacity:.92}); let sd=7; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  for(let i=0;i<9;i++){ const a=i/9*Math.PI*2+rnd()*.5, R=52+rnd()*16, cx=Math.sin(a)*R, cz=Math.cos(a)*R, cy=20+rnd()*14;
    for(let k=0;k<5;k++){ const b=new THREE.Mesh(new THREE.SphereGeometry(3+rnd()*2.5,8,6),cm); b.position.set(cx+(k-2)*3.2+rnd()*2,cy+rnd()*1.4,cz+rnd()*3); b.scale.y=.5; clouds.add(b); } } })();
const stars = (function(){ const n=260, p=new Float32Array(n*3); let sd=11; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  for(let i=0;i<n;i++){ const a=rnd()*Math.PI*2, h=.12+rnd()*.85, r=Math.sqrt(1-h*h); p.set([Math.cos(a)*r*80,h*80,Math.sin(a)*r*80],i*3); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pt=new THREE.Points(g,new THREE.PointsMaterial({color:C(0xffffff),size:2.2,sizeAttenuation:false,fog:false})); pt.visible=false; pt.frustumCulled=false; scene.add(pt); return pt; })();
const cam = new THREE.PerspectiveCamera(86, 1, 0.05, 90);
const cctvCam = new THREE.PerspectiveCamera(78, 1, 0.1, 90);
scene.add(cam);

const floatOK = renderer.capabilities.isWebGL2 && (renderer.extensions.get('EXT_color_buffer_float') || renderer.extensions.get('EXT_color_buffer_half_float'));
function makeRT(){
  const rt = new THREE.WebGLRenderTarget(4,4,{ minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat, type: floatOK?THREE.HalfFloatType:THREE.UnsignedByteType, depthBuffer:true, stencilBuffer:false });
  rt.depthTexture = new THREE.DepthTexture(4,4); rt.depthTexture.type = THREE.UnsignedIntType;
  return rt;
}
let rtA = makeRT(), rtB = makeRT();

const postMat = new THREE.ShaderMaterial({
  depthTest:false, depthWrite:false,
  uniforms:{ tScene:{value:null}, tPrev:{value:null}, tDepth:{value:null}, uRes:{value:new THREE.Vector2(1,1)},

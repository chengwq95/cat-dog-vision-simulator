<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>猫狗视觉模拟器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<style>
/* 布局：全屏 3D 画面，四周浮动的深色玻璃 HUD；整体只有一种（夜间客厅）外观 */
:root{
  color-scheme: dark;
  --bg:#0b1016; --panel:rgba(14,20,28,.78); --line:rgba(255,255,255,.14);
  --fg:#eef2f5; --dim:#a9b4bf; --amber:#f5a524; --amber-ink:#1a1204;
  --teal:#3fc6b5; --cctv:#58e08a; --danger:#ef4444;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gl: max(12px, env(safe-area-inset-left, 0px)); --gr: max(12px, env(safe-area-inset-right, 0px));
  --gt: calc(10px + env(safe-area-inset-top, 0px)); --gb: calc(12px + env(safe-area-inset-bottom, 0px));
}
*{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%; margin:0; overflow:hidden}
body{background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px}
#stage{position:fixed; inset:0; overflow:hidden; background:var(--bg)}
#stage canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0}
button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
#topbar{position:fixed; top:var(--gt); left:var(--gl); right:var(--gr); z-index:20; display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; justify-content:space-between; pointer-events:none}
#topbar > *{pointer-events:auto}
#brand{display:flex; align-items:center; gap:8px; padding:7px 12px}
#brand b{font-size:13px; letter-spacing:.02em} #brand small{display:block; color:var(--dim); font-size:11px}
#controls{display:flex; flex-wrap:wrap; gap:6px; padding:5px; align-items:center}
.seg{display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:10px; padding:2px}
.btn{display:flex; align-items:center; gap:5px; height:32px; padding:0 10px; border-radius:8px; font-size:12px; font-weight:600; color:var(--dim); white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.08); color:var(--fg)}
.btn.on{background:var(--amber); color:var(--amber-ink)}
.btn.tog.on{background:var(--teal); color:#04201c}
#right{display:flex; gap:6px}
#right .btn{background:var(--panel); border:1px solid var(--line); border-radius:12px; height:36px}
@media (max-width:1400px){ html[lang="en"] #brand b{display:none} }
@media (max-width:1080px){ html[lang="en"] .btn .t{display:none} html[lang="en"] .btn{padding:0 9px; font-size:15px} }
@media (max-width:760px){ #brand small, .btn .t{display:none} .btn{padding:0 9px; font-size:15px} #brand{padding:7px 10px} }

#todo{position:fixed; z-index:19; right:var(--gr); top:calc(var(--gt) + 52px); width:236px; padding:10px 12px; max-height:60%; overflow:auto}
#todo h2{margin:0 0 6px; font-size:12px; color:var(--amber); display:flex; justify-content:space-between}
#todo ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
#todo li{font-size:12px; color:var(--fg); display:flex; gap:7px; align-items:baseline; line-height:1.35}
#todo li::before{content:"○"; color:var(--dim); flex:none}
#todo li.done{color:var(--dim); text-decoration:line-through}
#todo li.done::before{content:"●"; color:var(--teal)}
@media (max-width:760px){ #todo{top:calc(var(--gt) + 140px); width:200px} }

#toast{position:fixed; z-index:22; left:50%; top:calc(var(--gt) + 96px); transform:translateX(-50%); max-width:min(520px, calc(100% - 32px)); padding:9px 14px; font-size:12.5px; line-height:1.5; text-align:center; opacity:0; transition:opacity .3s; pointer-events:none}
#toast.show{opacity:1} #toast b{color:var(--amber)}
@media (max-width:760px){ #toast{top:calc(var(--gt) + 214px)} }

#prompt{position:fixed; z-index:21; left:50%; bottom:calc(var(--gb) + 86px); transform:translateX(-50%); background:var(--amber); color:var(--amber-ink); font-weight:700; font-size:13px; padding:9px 16px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.4); white-space:nowrap}
#prompt kbd{font-family:var(--mono); background:rgba(0,0,0,.18); border-radius:5px; padding:1px 6px; margin-right:6px}

#split{position:fixed; z-index:18; top:0; bottom:0; width:44px; margin-left:-22px; cursor:ew-resize; touch-action:none; display:flex; justify-content:center}
#split::before{content:""; width:2px; background:#fff; box-shadow:0 0 8px rgba(0,0,0,.6)}
#split .knob{position:absolute; top:50%; width:38px; height:38px; margin-top:-19px; border-radius:50%; background:#fff; color:#111; display:grid; place-items:center; font-size:15px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.45)}
#split .lab{position:absolute; bottom:calc(var(--gb) + 150px); font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; white-space:nowrap}
#split .lab.l{right:30px} #split .lab.r{left:30px}

#cctv{position:fixed; inset:0; z-index:17; pointer-events:none; font-family:var(--mono); color:var(--cctv); text-shadow:0 1px 2px #000}
#cctv .tl{position:absolute; left:var(--gl); bottom:calc(var(--gb) + 6px); font-size:12px; line-height:1.6}
#cctv .rec{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--danger); margin-right:6px; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.15}}
@media (pointer:coarse){ #cctv .tl{bottom:calc(var(--gb) + 150px)} }
#cams{position:fixed; z-index:20; left:50%; transform:translateX(-50%); top:calc(var(--gt) + 52px); display:flex; gap:4px; padding:4px; max-width:calc(100% - 24px); flex-wrap:wrap; justify-content:center}
#cams .btn{font-family:var(--mono); font-size:11px; height:28px; color:var(--cctv)}
#cams .btn.on{background:var(--cctv); color:#03170a}
@media (max-width:760px){ #cams{top:calc(var(--gt) + 140px); width:calc(100% - 24px)} }

#touch{position:fixed; inset:0; z-index:16; pointer-events:none}
#joy{position:absolute; left:calc(var(--gl) + 8px); bottom:calc(var(--gb) + 8px); width:124px; height:124px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid var(--line); pointer-events:auto; touch-action:none}
#joy i{position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px; border-radius:50%; background:rgba(255,255,255,.35)}
#acts{position:absolute; right:calc(var(--gr) + 6px); bottom:calc(var(--gb) + 10px); display:flex; gap:12px; align-items:flex-end; pointer-events:auto}
#acts button{width:66px; height:66px; border-radius:50%; font-size:22px; background:rgba(255,255,255,.14); border:1px solid var(--line); touch-action:none}
#acts button:active{background:var(--amber)}
#acts #b-jump{width:78px; height:78px; margin-bottom:26px}

#nap{position:fixed; inset:0; z-index:25; background:#05070c; display:grid; place-items:center; font-size:44px; opacity:0; pointer-events:none; transition:opacity .7s}
#nap.show{opacity:1}

#modal{position:fixed; inset:0; z-index:30; background:rgba(4,7,11,.72); display:grid; place-items:center; padding:16px; overflow:auto}
#modal .card{width:min(560px,100%); padding:22px; border-radius:20px; background:#111922; border:1px solid var(--line)}
#modal h1{margin:0 0 4px; font-size:21px; text-wrap:balance} #modal p.sub{margin:0 0 14px; color:var(--dim); font-size:13px}
#modal h3{margin:14px 0 6px; font-size:12px; color:var(--amber); letter-spacing:.06em}
#modal ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px; font-size:13px; line-height:1.55; color:#d5dde4}
#modal .keys{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13px; color:#d5dde4}
#modal .keys span:nth-child(odd){font-family:var(--mono); color:var(--amber); white-space:nowrap}
#modal .pick{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 14px}
#modal .pick button{height:44px; border-radius:12px; border:1px solid var(--line); background:#1a2530; color:var(--fg); font-weight:700; font-size:14px}
#modal .pick button.on{background:var(--amber); color:var(--amber-ink); border-color:transparent}
#modal .go{margin-top:18px; width:100%; height:44px; border-radius:12px; background:var(--amber); color:var(--amber-ink); font-weight:800; font-size:15px}
#err{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; text-align:center; background:var(--bg); color:var(--fg)}

.touch-ui{--stick-size:clamp(96px,min(31vw,32vh),124px); --bar-gap:6px}
.touch-ui #topbar{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:var(--bar-gap)}
.touch-ui #brand{justify-self:start; max-width:100%; overflow:hidden; white-space:nowrap; pointer-events:none}
.touch-ui #right{grid-column:2; grid-row:1; gap:4px}
.touch-ui #right .btn{justify-content:center; min-width:44px; height:44px; padding:0 7px}
.touch-ui #t-controls .t{display:inline; font-size:12px}
.touch-ui #controls{display:none; position:absolute; top:calc(100% + var(--bar-gap)); right:0; width:max-content; max-width:100%; max-height:calc(100dvh - var(--gt) - var(--gb) - 56px); overflow-y:auto; overscroll-behavior:contain; gap:4px; padding:6px}
.touch-ui #topbar.options-open #controls{display:flex}
.touch-ui #controls .seg{max-width:100%}
.touch-ui #controls .btn,.touch-ui #cams .btn{min-width:44px; min-height:44px; justify-content:center}
.touch-ui #controls .btn{padding:0 7px; gap:3px}
.touch-ui #controls .t{display:inline; font-size:12px}
.touch-ui #todo,.touch-ui #cams{top:calc(var(--gt) + 44px + var(--bar-gap))}
.touch-ui #todo{max-height:calc(100% - var(--gt) - var(--gb) - 60px - var(--stick-size)); overscroll-behavior:contain}
.touch-ui #cams{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); width:max-content; max-width:calc(100% - var(--gl) - var(--gr))}
.touch-ui #cams .btn{padding:2px 6px; height:auto; white-space:normal; line-height:1.15}
.touch-ui #topbar.options-open ~ #cams,.touch-ui #todo:not([hidden]) ~ #cams{display:none}
.touch-ui #toast{top:calc(var(--gt) + 54px); width:max-content}
.touch-ui #cams:not([hidden]) ~ #toast{top:calc(var(--gt) + 112px)}
.touch-ui #topbar.options-open ~ #toast,.touch-ui #todo:not([hidden]) ~ #toast{z-index:15}
.touch-ui #joy{width:var(--stick-size); height:var(--stick-size)}
.touch-ui #joy,.touch-ui #acts button{background:rgba(17,27,35,.58); border-color:rgba(255,255,255,.65); box-shadow:0 1px 6px rgba(0,0,0,.22)}
.touch-ui #joy i{background:rgba(255,255,255,.78)}
.touch-ui #acts{pointer-events:none}
.touch-ui #acts button{pointer-events:auto}
.touch-ui #acts button:active{background:var(--amber); color:var(--amber-ink)}
.touch-ui #prompt{bottom:calc(var(--gb) + var(--stick-size) + 14px); max-width:calc(100% - var(--gl) - var(--gr)); min-height:44px; white-space:normal}
.touch-ui #cctv .tl,.touch-ui #split .lab{bottom:calc(var(--gb) + var(--stick-size) + 12px); pointer-events:none}
.touch-ui #split{pointer-events:none}
.touch-ui #split .knob{pointer-events:auto; touch-action:none; width:44px; height:44px; margin-top:-22px}
.touch-ui #modal{display:flex; padding:var(--gt) var(--gr) var(--gb) var(--gl); overflow:hidden}
.touch-ui #modal .card{display:flex; flex-direction:column; max-height:100%; margin:auto; padding:16px}
.touch-ui #modal .intro-copy{min-height:0; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y}
.touch-ui #modal .pick,.touch-ui #modal .go{flex-shrink:0}
@media(max-width:380px){.touch-ui #brand b{display:none}}
@media (prefers-reduced-motion: reduce){ #cctv .rec{animation:none} #toast,#nap{transition:none} }
</style>

<div id="stage"></div>

<div id="topbar">
  <div id="brand" class="panel"><span style="font-size:18px">🐈</span><div><b>猫狗视觉模拟器</b></div></div>
  <div id="controls" class="panel">
    <button class="btn tog" id="t-animal" title="切换猫 / 狗（Q）">🐶<span class="t">换成狗</span></button>
    <div class="seg" role="group" aria-label="视角">
      <button class="btn on" id="v-1st" title="第一人称">👁️<span class="t">第一人称</span></button>
      <button class="btn" id="v-3rd" title="第三人称">🎥<span class="t">第三人称</span></button>
      <button class="btn" id="v-cctv" title="CCTV 监控">📹<span class="t">CCTV</span></button>
    </div>
    <div class="seg" role="group" aria-label="视觉">
      <button class="btn on" id="e-cat" title="猫咪视觉">🐱<span class="t">猫咪视觉</span></button>
      <button class="btn" id="e-human" title="人类视觉">🧑<span class="t">人类视觉</span></button>
      <button class="btn" id="e-split" title="左右对比">◐<span class="t">对比</span></button>
    </div>
    <button class="btn tog" id="t-night" title="白天 / 关灯夜晚">☀️<span class="t">白天</span></button>
    <button class="btn tog" id="t-rain" title="下雨">🌧️<span class="t">下雨</span></button>
    <button class="btn tog" id="t-q" title="画质">✨<span class="t">高画质</span></button>
  </div>
  <div id="right">
    <button class="btn" id="t-controls" title="设置" aria-controls="controls" aria-expanded="false" hidden>⚙<span class="t">设置</span></button>
    <button class="btn" id="t-todo" title="今日待办">📋 <span id="todo-count">0/10</span></button>
    <button class="btn" id="t-lang" title="语言 / Language">EN</button>
    <button class="btn" id="t-info" title="说明">❔</button>
  </div>
</div>

<div id="todo" class="panel"><h2><span>今日待办</span><span id="todo-count2">0/10</span></h2><ul id="todo-list"></ul></div>
<div id="cams" class="panel" hidden></div>
<div id="toast" class="panel"></div>
<button id="prompt" hidden></button>
<div id="split" hidden><span class="lab l">🧑 人类视觉</span><span class="knob">⇔</span><span class="lab r">🐱 猫咪视觉</span></div>
<div id="cctv" hidden><div class="tl"><div><span class="rec"></span>REC · <span id="cam-name"></span></div><div id="cam-time"></div></div></div>
<div id="touch" hidden>
  <div id="joy"><i></i></div>
  <div id="acts"><button id="b-paw" aria-label="互动">🐾</button><button id="b-jump" aria-label="跳跃">⤴</button></div>
</div>
<div id="nap">💤</div>

<div id="modal">
  <div class="card">
    <div class="pick" role="group" aria-label="选择动物"><button id="pick-cat" class="on">🐈 当猫</button><button id="pick-dog">🐕 当狗</button></div>
    <div class="intro-copy">
      <h1 id="m-title"></h1>
      <p class="sub" id="m-sub"></p>
      <h3 id="m-h3"></h3>
      <ul id="m-list"></ul>
      <h3>怎么玩</h3>
      <div class="keys" id="keys-desktop">
        <span>W A S D</span><span>走动（按住 Shift 奔跑）</span>
        <span>鼠标</span><span>点击画面后移动鼠标环顾，Esc 释放</span>
        <span>空格</span><span>跳上沙发、餐桌、床、车顶</span>
        <span>E</span><span id="m-e">挥爪互动，没东西可玩时喵一声</span>
        <span>Q</span><span>在猫和狗之间切换</span>
      </div>
      <div class="keys" id="keys-touch" hidden>
        <span>左下摇杆</span><span>走动，推到底奔跑</span>
        <span>滑动画面</span><span>环顾四周</span>
        <span>⤴ / 🐾</span><span>跳跃 / 挥爪互动</span>
      </div>
    </div>
    <button class="go" id="go">开始巡视</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// Each drag keeps its original finger until release. Other controls can be used at the same time.
function bindDrag(element,start,move,finish){
  let pointer=null;
  function stop(){
    if(pointer===null) return;
    const id=pointer;
    pointer=null;
    if(element.hasPointerCapture && element.hasPointerCapture(id)) element.releasePointerCapture(id);
    if(finish) finish();
  }
  function end(e){ if(e.pointerId===pointer) stop(); }
  element.addEventListener('pointerdown',e=>{
    if(pointer!==null || e.button!==0 || !$('modal').hidden) return;
    pointer=e.pointerId;
    try{ element.setPointerCapture(pointer); }catch(_){ /* Pointer lock can own a mouse drag. */ }
    start(e);
  });
  // WebKit can deliver the first move to the element under the finger before capture takes effect.
  window.addEventListener('pointermove',e=>{ if(e.pointerId===pointer) move(e); });
  element.addEventListener('lostpointercapture',e=>{ if(e.target===element) end(e); });
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
  return stop;
}

    for(let k=0;k<7&&nearSolid(want.x,want.y,want.z,.16);k++){ dist=Math.max(.2,dist*.8); want.set(hx+dx*dist,Math.max(.06,hy+dy*dist),hz+dz*dist); }   // 镜头离墙和天花板太近就拉近，避免看穿
    if(cam.position.distanceTo(want)>3) cam.position.copy(want); else { cam.position.lerp(want,Math.min(1,dt*14)); const lx=cam.position.x-hx, ly=cam.position.y-hy, lz=cam.position.z-hz, ll=Math.hypot(lx,ly,lz)||1;
      if(nearSolid(cam.position.x,cam.position.y,cam.position.z,.12)||rayHit(hx,hy,hz,lx/ll,ly/ll,lz/ll,ll)<ll-.02) cam.position.copy(want); }

  } else { const c=CAMS[S.cam]; active=cctvCam; cctvCam.position.set(c[1][0],c[1][1],c[1][2]);
    const tg=new THREE.Vector3(c[2][0],c[2][1],c[2][2]), cp=cctvCam.position, dx=cat.pos.x-cp.x, dy=cat.pos.y+.2-cp.y, dz=cat.pos.z-cp.z, dl=Math.hypot(dx,dy,dz);
    if(dl<9 && rayHit(cp.x,cp.y,cp.z,dx/dl,dy/dl,dz/dl,dl)>dl-.35) tg.lerp(cat.pos,.5);   // 看得见猫才跟拍，否则回到默认机位
    if(cctvI!==S.cam){ cctvI=S.cam; cctvT.copy(tg); } else cctvT.lerp(tg,Math.min(1,dt*3)); cctvCam.lookAt(cctvT); camSmooth.y=cat.pos.y; }
  if(Math.abs(cam.fov-targetFov)>.05){ cam.fov+=(targetFov-cam.fov)*Math.min(1,dt*6); cam.updateProjectionMatrix(); }
  // 猫静止不动时才凸显运动物体
  const moved = active.position.distanceTo(lastEye)>.0015 || Math.abs(S.yaw+S.pitch*3-lastYaw)>.0008; lastEye.copy(active.position); lastYaw=S.yaw+S.pitch*3;
  still = moved?0:Math.min(1,still+dt*2.5); const u=postMat.uniforms; u.uMotion.value=(S.hq&&S.view!=='cctv')?still:0; u.uTime.value=time; u.uDog.value=S.animal==='dog'?1:0;
  u.uSplit.value = S.view==='cctv'?0 : S.vision==='cat'?0 : S.vision==='human'?1 : S.split;
  u.uNear.value=active.near; u.uFar.value=active.far;
  return active;
}
